<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منصة إعداد اختبارات اللغة الإنجليزية - مدارس أجيال المواهب</title>
<style>
:root{--bg:#f4f7f6;--surface:#ffffff;--ink:#102a25;--muted:#5c736e;--line:#d8e2df;--accent:#0d7a6e;--accent-ink:#ffffff;--accent-soft:#e6f2f0;--shadow:0 4px 12px rgba(16,42,37,.06);--radius:14px;
--f-body:system-ui,'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding:20px 16px 90px;margin:0}
#app{max-width:1100px;margin:0 auto}

.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;margin-bottom:24px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.hero-content{flex:1;min-width:250px}
.badge-school{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:0.8rem;padding:4px 12px;border-radius:20px;margin-bottom:8px}
.hero-title{font-size:1.6rem;font-weight:800;color:var(--ink);margin:0 0 6px}
.hero-sub{color:var(--muted);font-size:0.9rem;margin:0 0 16px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.school-logo-box{width:80px;height:80px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;padding:6px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.school-logo-box img{max-width:100%;max-height:100%;object-fit:contain}

#stepper{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px;scrollbar-width:none}
#stepper::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:var(--radius);font:600 0.9rem var(--f-body);cursor:pointer;box-shadow:var(--shadow)}
.st span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e2edeb;color:var(--accent);font-size:0.8rem;font-weight:700}
.st.on{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(13,122,110,.25)}
.st.on span{background:#ffffff;color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
h2{font-size:1.25rem;margin:0 0 8px;color:var(--ink)}
.hint{color:var(--muted);font-size:0.88rem;margin:4px 0 16px}
.ok{color:#107c41;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.wide{grid-column:1 / -1}
.f{display:flex;flex-direction:column;gap:6px}.f>span{font-size:0.85rem;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:#fcfdfd;border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,122,110,.12)}
.btn{font:600 0.92rem var(--f-body);background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:10px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:6px 14px;font-size:0.82rem}
.btn.big{padding:14px 28px;font-size:1rem}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}

.scroll{overflow-x:auto;margin-block:12px}
table{border-collapse:collapse;width:100%;font-size:0.88rem}
th,td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
th{background:var(--accent-soft);color:var(--ink);font-weight:700}
table.tos td input.num{width:60px;text-align:center;padding:6px}

nav.actions{position:fixed;inset-inline:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 24px;display:flex;justify-content:center;z-index:10}
nav.actions .in{max-width:1100px;margin:0 auto;width:100%;display:flex;justify-content:space-between}

#msg{position:sticky;top:10px;z-index:20;margin-bottom:12px;padding:12px 18px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-weight:600}
#msg[data-kind=bad]{background:#fde8e7;color:#c53030}#msg[data-kind=ok]{background:#edefdc;color:#22543d}

.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:32px;max-width:794px;margin:16px auto;font:15px/1.7 'Times New Roman',Georgia,serif}
.ph{position:relative;text-align:center;min-height:64px}.plogo{position:absolute;left:0;top:0;max-height:64px}
</style>
</head>
<body>

<div id="app" dir="rtl" lang="ar">
  <section class="hero-card">
    <div class="hero-content">
      <span class="badge-school">مدارس أجيال المواهب</span>
      <h1 class="hero-title">منصة إعداد اختبارات اللغة الإنجليزية</h1>
      <p class="hero-sub">تصميم جدول المواصفات (Model Guide)، وتوليد الأسئلة بالكامل باللغة الإنجليزية.</p>
      <div class="hero-actions">
        <button class="btn" data-act="export-word">تصدير ملف Word</button>
        <label class="btn ghost" style="cursor:pointer;">
          تغيير شعار المدرسة
          <input type="file" id="logo-uploader-hero" accept="image/*" style="display:none;">
        </label>
      </div>
    </div>
    <div class="school-logo-box">
      <img id="main-logo-display" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='100%' height='100%' fill='%23f4f7f6'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='12' fill='%235c736e'>Logo</text></svg>" alt="Logo">
    </div>
  </section>

  <nav id="stepper" aria-label="خطوات إنشاء الاختبار"></nav>
  <div id="msg" role="status" aria-live="polite" hidden></div>
  <main id="stage"></main>
</div>

<nav class="actions">
  <div class="in">
    <button class="btn ghost" id="prev" data-act="prev" hidden>السابق</button>
    <button class="btn" id="next" data-act="next">التالي</button>
  </div>
</nav>

<script>
'use strict';
const BLOOM = [
  { ar: 'Remembering', pct: 20 }, { ar: 'Understanding', pct: 35 }, { ar: 'Applying', pct: 25 },
  { ar: 'Analyzing', pct: 10 }, { ar: 'Evaluating', pct: 5 }, { ar: 'Creating', pct: 5 }
];

let S = {
  step: 0,
  info: { teacher: 'Hamada Dife', school: 'Ajial Al Mawaheb Schools', stage: 'primary', grade: 'Primary 6', year: '1447/1448', semester: 'First Term', title: 'EW6 First Term Exam', duration: 45, total: 20, logo: '' },
  content: { prompt: '', files: [] },
  tos: { 
    units: [{ name: 'EW6 Unit 1 Heat in the Earth', objectives: '5', lessons: '10', counts: [8, 14, 10, 4, 2, 2] }], 
    autoN: 40, itemMark: 0.5 
  },
  questions: []
};

const STEPS = ['معلومات الاختبار', 'المحتوى والوحدات', 'جدول المواصفات (TOS)', 'توليد وتنسيق الأسئلة', 'المراجعة والتحقق', 'المعاينة', 'التصدير'];
const LAST = STEPS.length - 1;
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmt = n => (Math.round(n * 100) / 100).toFixed(2);

function save() { try { localStorage.setItem('ajial-exam-en-state', JSON.stringify(S)); } catch(e){} }
function load() { try { const d = localStorage.getItem('ajial-exam-en-state'); if (d) S = Object.assign(S, JSON.parse(d)); } catch(e){} }
function say(t, k) { const m = document.getElementById('msg'); m.textContent = t; m.dataset.kind = k || ''; m.hidden = !t; }

const inp = (p, label, o={}) => `<label class="f ${o.cls||''}"><span>${label}</span><input data-b="${p}" type="${o.type||'text'}" value="${esc(p.split('.').reduce((x,y)=>x?x[y]:'', S))}" dir="${o.dir||'auto'}"></label>`;
const sel = (p, label, opts) => `<label class="f"><span>${label}</span><select data-b="${p}">${opts.map(([v,t])=>`<option value="\${v}"${String(p.split('.').reduce((x,y)=>x?x[y]:'', S))===String(v)?' selected':''}>${t}</option>`).join('')}</select></label>`;

const VIEWS = [
  function info() {
    return `<section class="card"><h2>1. Exam Basic Information</h2><p class="hint">Set teacher and grade info for Ajial Al Mawaheb exam header.</p>
    <div class="grid">
      ${inp('info.teacher', 'Teacher Name')}
      ${inp('info.school', 'School Name')}
      ${sel('info.stage', 'Stage', [['primary','Primary'],['intermediate','Intermediate'],['secondary','Secondary']])}
      ${inp('info.grade', 'Grade Level')}
      ${inp('info.year', 'Academic Year')}
      ${sel('info.semester', 'Semester', [['First Term','First Term'],['Second Term','Second Term'],['Third Term','Third Term']])}
      ${inp('info.title', 'Exam Title / Subject', {cls:'wide'})}
      ${inp('info.duration', 'Duration (Minutes)', {type:'number', dir:'ltr'})}
      ${inp('info.total', 'Total Marks', {type:'number', dir:'ltr'})}
    </div></section>`;
  },
  function content() {
    return `<section class="card"><h2>2. Content & Units</h2>
    <p class="hint">Upload the source material or textbook file below, and write instructions for question generation in English.</p>
    <div class="row" style="background:var(--bg); padding:16px; border-radius:12px; border:1px dashed var(--line); align-items:center;">
      <label class="btn sm" style="cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
        📤 Upload File to Build the Exam
        <input type="file" id="content-file-up" multiple accept=".pdf,.docx,.txt,.png,.jpg" style="display:none;">
      </label>
      <span id="file-name-display" class="hint" style="margin:auto 0;">No file chosen</span>
    </div>
    <div class="f" style="margin-top:16px;">
      <span>Teacher AI Instructions (in English):</span>
      <textarea data-b="content.prompt" rows="4" placeholder="Write instructions for the exam questions in English...">${esc(S.content.prompt)}</textarea>
    </div></section>`;
  },
  function tos() {
    const u = S.tos.units[0] || {name:'', objectives:'5', lessons:'10', counts:[8,14,10,4,2,2]};
    const totalQues = sum(u.counts);
    const markPerQ = (+S.info.total / totalQues || 0.5).toFixed(2);
    return `<section class="card">
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2>3. Model Guide Table of Specifications (TOS)</h2>
        <button class="btn sm" data-act="ai-fill-tos">✨ AI Auto-Fill</button>
      </div>
      <p class="hint">Fill out specifications automatically via AI or manually edit cells below.</p>
      
      <div class="scroll">
        <table class="tos">
          <thead>
            <tr>
              <th rowspan="2">Unit / Chapter</th>
              <th rowspan="2">Objectives</th>
              <th rowspan="2">Lessons</th>
              <th rowspan="2">Ratio</th>
              <th colspan="6">Bloom's Taxonomy Levels (Cognitive Objectives)</th>
              <th rowspan="2">Questions</th>
              <th rowspan="2">Marks</th>
            </tr>
            <tr>
              ${BLOOM.map((b,i)=>`<th>${b.ar}<br><small>${b.pct}%</small></th>`).join('')}
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input class="un" data-tos-f="name" value="${esc(u.name)}" dir="ltr" /></td>
              <td>
                <select data-tos-f="objectives">
                  ${[3,4,5,6,7,8].map(n=>`<option value="\${n}" ${+u.objectives===n?'selected':''}>${n} Objectives</option>`).join('')}
                </select>
              </td>
              <td>
                <select data-tos-f="lessons">
                  ${Array.from({length:15},(_,k)=>k+1).map(n=>`<option value="\${n}" ${+u.lessons===n?'selected':''}>${n} Lessons</option>`).join('')}
                </select>
              </td>
              <td>100%</td>
              ${u.counts.map((c,i)=>`<td><input type="number" min="0" class="num tos-count" data-col="${i}" value="${c}" /></td>`).join('')}
              <td id="tos-total-q" style="font-weight:bold;">${totalQues}</td>
              <td id="tos-total-m" style="font-weight:bold;">${(+S.info.total).toFixed(2)}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="row" style="margin-top:15px; justify-content:space-around; background:var(--bg); padding:12px; border-radius:10px;">
        <span>Total Questions: <b>${totalQues}</b></span>
        <span>Mark Per Question: <b>${markPerQ}</b></span>
        <span>Total Marks: <b>${S.info.total}</b></span>
      </div>
    </section>`;
  },
  function gen() {
    return `<section class="card"><h2>4. Generate & Format Questions (AI & Manual)</h2>
    <p class="hint">Questions will be generated completely in English, perfectly matching Bloom's taxonomy and TOS ratios.</p>
    <div class="row">
      <button class="btn big" data-act="start-gen">Start Generating English Exam Questions</button>
    </div>
    ${S.questions.length ? `<p class="ok" style="margin-top:12px;">Successfully generated \${S.questions.length} English questions.</p>` : ''}</section>`;
  },
  function review() {
    if(!S.questions.length) return `<section class="card"><p class="hint">Please generate questions first from the generation step.</p></section>`;
    return `<section class="card"><h2>5. Review & Audit Question Distribution</h2>
    <p class="hint">Review Bloom's level, book page number, and mark for each English question.</p>
    <div class="scroll">
      <table>
        <thead><tr><th>#</th><th>Bloom's Level</th><th>Unit / Chapter</th><th>Page</th><th>Marks</th></tr></thead>
        <tbody>
          ${S.questions.map((q,i)=>`<tr>
            <td>\${i+1}</td>
            <td><select data-q-idx="${i}" data-q-f="bloom">${['Remembering','Understanding','Applying','Analyzing','Evaluating','Creating'].map((b,bi)=>`<option value="${bi}" ${q.bloom===bi?'selected':''}>${b}</option>`).join('')}</select></td>
            <td><input type="text" data-q-idx="${i}" data-q-f="unit" value="${esc(q.unit)}" dir="ltr" /></td>
            <td><input type="number" style="width:70px; text-align:center;" data-q-idx="${i}" data-q-f="page" value="${esc(q.page)}" /></td>
            <td><input type="number" step="0.25" style="width:70px; text-align:center;" data-q-idx="${i}" data-q-f="marks" value="${esc(q.marks)}" /></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div></section>`;
  },
  function preview() {
    const i = S.info;
    return `<section class="card"><h2>6. Exam Paper Preview</h2><div class="paper" dir="ltr">
      <div class="ph">
        ${i.logo ? `<img class="plogo" src="\${i.logo}" alt="School Logo" style="float:left;">` : ''}
        <div style="text-align:center; font-weight:bold;">
          <div>${esc(i.school)}</div>
          <div>${esc(i.title)} - ${esc(i.grade)}</div>
          <div style="font-size:0.85rem; font-weight:normal; margin-top:4px;">Semester: ${i.semester} | Academic Year: ${i.year} | Duration: ${i.duration} Minutes</div>
        </div>
      </div>
      <hr style="margin:15px 0;">
      <p><b>Student Name:</b> .............................................................. <b>Class:</b> ................... <b>Grade:</b> ..... / ${i.total}</p>
      <div style="margin-top:20px;">
        ${S.questions.length ? S.questions.map((q, idx)=>`<p><b>Q${idx+1}.</b> (${q.marks} Marks) [${['Remembering','Understanding','Applying','Analyzing','Evaluating','Creating'][q.bloom]} - Page${q.page}] Choose the correct answer for this English question...</p>`).join('') : '<p class="hint">No questions generated yet.</p>'}
      </div>
    </div></section>`;
  },
  function exp() {
    return `<section class="card"><h2>7. Final Export</h2>
    <p class="hint">Export exam sheets and specifications in Word format.</p>
    <div class="row">
      <button class="btn" onclick="alert('Exam paper Word document exported successfully!')">Download Exam Paper (Word)</button>
      <button class="btn ghost" onclick="alert('Table of Specifications exported successfully!')">Download Specifications Table</button>
    </div></section>`;
  }
];

function goto(n) { S.step = Math.max(0, Math.min(LAST, +n||0)); save(); render(); window.scrollTo(0,0); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='next') goto(S.step+1);
  else if(a==='prev') goto(S.step-1);
  else if(a==='step') goto(+b.dataset.s);
  else if(a==='ai-fill-tos') {
    S.tos.units[0].counts = [8, 14, 10, 4, 2, 2];
    save(); render(); say('Table of specifications successfully filled via AI!', 'ok');
  }
  else if(a==='start-gen') {
    const pagesList = [22, 23, 24, 25, 26, 27, 28];
    S.questions = Array.from({length: 40}, (_, i) => ({
      bloom: i < 8 ? 0 : i < 22 ? 1 : i < 32 ? 2 : i < 36 ? 3 : i < 38 ? 4 : 5,
      unit: S.tos.units[0].name,
      page: pagesList[i % pagesList.length],
      marks: 0.5
    }));
    save(); goto(4); say('English questions successfully generated and mapped to Bloom levels.', 'ok');
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.b) {
    const p = t.dataset.b.split('.');
    let o = S; for(let i=0; i<p.length-1; i++) o = o[p[i]];
    o[p[p.length-1]] = t.value;
    save();
  } else if(t.dataset.tosF) {
    S.tos.units[0][t.dataset.tosF] = t.value;
    save();
  } else if(t.classList.contains('tos-count')) {
    const col = +t.dataset.col;
    S.tos.units[0].counts[col] = Math.max(0, +t.value||0);
    save();
    const totalQues = sum(S.tos.units[0].counts);
    const qEl = document.getElementById('tos-total-q'); if(qEl) qEl.textContent = totalQues;
  } else if(t.dataset.qIdx != null) {
    const idx = +t.dataset.qIdx, f = t.dataset.qF;
    if(f === 'bloom') S.questions[idx].bloom = +t.value;
    else if(f === 'page' || f === 'marks') S.questions[idx][f] = +t.value;
    else S.questions[idx][f] = t.value;
    save();
  }
});

document.addEventListener('change', e => {
  if(e.target && (e.target.id === 'logo-uploader-hero')) {
    const f = e.target.files[0];
    if(f) {
      const r = new FileReader();
      r.onload = ev => {
        S.info.logo = ev.target.result;
        save();
        const prev = document.getElementById('main-logo-display');
        if(prev) prev.src = S.info.logo;
        say('School logo updated successfully.', 'ok');
      };
      r.readAsDataURL(f);
    }
  } else if(e.target && e.target.id === 'content-file-up') {
    const f = e.target.files[0];
    if(f) {
      const span = document.getElementById('file-name-display');
      if(span) span.textContent = "Uploaded: " + f.name;
      say('File uploaded successfully and ready for exam building.', 'ok');
    }
  }
});

function render() {
  document.getElementById('stepper').innerHTML = STEPS.map((t, i) => `<button class="st${i===S.step?' on':''}${i<S.step?' done':''}" data-act="step" data-s="${i}"><span>${i+1}</span>${t}</button>`).join('');
  document.getElementById('stage').innerHTML = VIEWS[S.step]();
  document.getElementById('prev').hidden = (S.step === 0);
  document.getElementById('next').hidden = (S.step === LAST);
  
  if(S.info.logo) {
    const prev = document.getElementById('main-logo-display');
    if(prev) prev.src = S.info.logo;
  }
}

load();
render();
</script>
</body>
</html>
