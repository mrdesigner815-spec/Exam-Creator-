<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إعداد اختبارات اللغة الإنجليزية - وفق جداول المواصفات الرسمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Arabic', 'Inter', system-ui, sans-serif; }
        .tab-transition { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-[#eef3f1] text-[#14302b] min-h-screen pb-24">

    <div id="app" class="max-w-6xl mx-auto px-4 py-6">
        
        <!-- Header Section -->
        <header class="flex items-center justify-between bg-white border border-[#d3dfdb] rounded-2xl p-6 shadow-sm mb-6 flex-wrap gap-4">
            <div class="flex items-center gap-4">
                <div id="school-logo-container" class="w-14 h-14 rounded-xl border border-[#d3dfdb] bg-white grid place-items-center overflow-hidden shrink-0 shadow-xs">
                    <span class="text-[10px] text-[#566b66] font-semibold text-center p-1">لا يوجد شعار</span>
                </div>
                <div>
                    <span id="header-school-badge" class="inline-block px-3 py-1 bg-[#dcefea] text-[#0b6b60] text-xs font-semibold rounded-full mb-2">مدارس أجيال المواهب</span>
                    <h1 class="text-2xl font-bold tracking-tight text-[#14302b]">منصة إعداد اختبارات اللغة الإنجليزية</h1>
                    <p class="text-sm text-[#566b66]">تصميم جدول المواصفات (Model Guide)، توليد الأسئلة آلياً ويدوياً، ومطابقة معايير الوزارة</p>
                </div>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <label class="cursor-pointer px-3 py-2 bg-[#dcefea] text-[#0b6b60] font-semibold rounded-xl text-sm hover:bg-[#cbe6e0] tab-transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    <span>رفع شعار المدرسة</span>
                    <input type="file" accept="image/*" onchange="app.uploadSchoolLogo(event)" class="hidden">
                </label>
                <button onclick="app.openSettings()" class="px-4 py-2 bg-[#dcefea] text-[#0b6b60] font-semibold rounded-xl text-sm hover:bg-[#cbe6e0] tab-transition">إعدادات الذكاء الاصطناعي</button>
                <button onclick="app.exportWord()" class="px-4 py-2 bg-[#0b6b60] text-white font-semibold rounded-xl text-sm hover:bg-[#09574e] tab-transition shadow-sm">تصدير ملف Word</button>
            </div>
        </header>

        <!-- Stepper Navigation -->
        <nav class="flex gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none" aria-label="مراحل إعداد الاختبار">
            <button onclick="app.setStep(1)" id="step-btn-1" class="step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#0b6b60] bg-[#0b6b60] text-white font-medium text-sm shrink-0 tab-transition shadow-sm">
                <span class="w-6 h-6 rounded-full bg-white/20 grid place-items-center text-xs font-bold">1</span>
                <span>معلومات الاختبار</span>
            </button>
            <button onclick="app.setStep(2)" id="step-btn-2" class="step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#d3dfdb] bg-white text-[#566b66] font-medium text-sm shrink-0 tab-transition">
                <span class="w-6 h-6 rounded-full bg-[#eef3f1] text-[#14302b] grid place-items-center text-xs font-bold">2</span>
                <span>المحتوى والوحدات</span>
            </button>
            <button onclick="app.setStep(3)" id="step-btn-3" class="step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#d3dfdb] bg-white text-[#566b66] font-medium text-sm shrink-0 tab-transition">
                <span class="w-6 h-6 rounded-full bg-[#eef3f1] text-[#14302b] grid place-items-center text-xs font-bold">3</span>
                <span>جدول المواصفات (TOS)</span>
            </button>
            <button onclick="app.setStep(4)" id="step-btn-4" class="step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#d3dfdb] bg-white text-[#566b66] font-medium text-sm shrink-0 tab-transition">
                <span class="w-6 h-6 rounded-full bg-[#eef3f1] text-[#14302b] grid place-items-center text-xs font-bold">4</span>
                <span>توليد وتنسيق الأسئلة (AI & Manual)</span>
            </button>
            <button onclick="app.setStep(5)" id="step-btn-5" class="step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#d3dfdb] bg-white text-[#566b66] font-medium text-sm shrink-0 tab-transition">
                <span class="w-6 h-6 rounded-full bg-[#eef3f1] text-[#14302b] grid place-items-center text-xs font-bold">5</span>
                <span>هرم بلوم وتوزيع الأسئلة</span>
            </button>
            <button onclick="app.setStep(6)" id="step-btn-6" class="step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#d3dfdb] bg-white text-[#566b66] font-medium text-sm shrink-0 tab-transition">
                <span class="w-6 h-6 rounded-full bg-[#eef3f1] text-[#14302b] grid place-items-center text-xs font-bold">6</span>
                <span>التدقيق ومطابقة المعايير</span>
            </button>
            <button onclick="app.setStep(7)" id="step-btn-7" class="step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#d3dfdb] bg-white text-[#566b66] font-medium text-sm shrink-0 tab-transition">
                <span class="w-6 h-6 rounded-full bg-[#eef3f1] text-[#14302b] grid place-items-center text-xs font-bold">7</span>
                <span>المعاينة والتصدير</span>
            </button>
        </nav>

        <!-- Main Stage Container -->
        <main id="main-stage" class="space-y-6">
            <!-- Dynamic view components will be rendered here -->
        </main>

    </div>

    <!-- AI Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 z-50 grid place-items-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <h3 class="text-lg font-bold">إعدادات مفتاح Claude API</h3>
            <p class="text-sm text-[#566b66]">يتم حفظ مفتاح التشغيل محلياً في متصفحك فقط لاستخدام ميزات التوليد الذكي وتعبئة جدول المواصفات وتدقيق الاختبارات.</p>
            <div>
                <label class="block text-xs font-semibold text-[#566b66] mb-1">مفتاح API (sk-ant-...)</label>
                <input type="password" id="api-key-input" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]" placeholder="sk-ant-..." dir="ltr">
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="app.closeSettings()" class="px-4 py-2 border border-[#d3dfdb] text-[#566b66] font-medium rounded-xl text-sm">إلغاء</button>
                <button onclick="app.saveSettings()" class="px-4 py-2 bg-[#0b6b60] text-white font-medium rounded-xl text-sm">حفظ المفتاح</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <script>
        const BLOOM_LEVELS = [
            { ar: 'التذكر', en: 'Remembering', pct: 20 },
            { ar: 'الفهم', en: 'Understanding', pct: 35 },
            { ar: 'التطبيق', en: 'Applying', pct: 25 },
            { ar: 'التحليل', en: 'Analyzing', pct: 10 },
            { ar: 'التقويم', en: 'Evaluating', pct: 5 },
            { ar: 'الإبداع', en: 'Creating', pct: 5 }
        ];

        class ExamApp {
            constructor() {
                this.state = {
                    step: 1,
                    info: {
                        teacher: 'Hamada Dife',
                        schoolName: 'مدارس أجيال المواهب',
                        stage: 'primary',
                        grade: 'الصف السادس الابتدائي (Primary 6)',
                        semester: 'الأول (First Semester)',
                        academicYear: '1447 / 1448',
                        examTitle: 'EW6 First Term Exam 2026',
                        examType: 'اختبار نهائي',
                        duration: '45 دقيقة',
                        totalMarks: 20,
                        logoBase64: null
                    },
                    contentNotes: '',
                    uploadedFileName: null,
                    units: [
                        { id: 'u1', name: 'EW6 Unit 1 Heat in the Earth', lessons: 10, objectivesCount: 5, counts: [8, 14, 10, 4, 2, 2] }
                    ],
                    questions: [
                        { id: 'q1', unit: 'u1', type: 'mcq', bloom: 2, text: 'The earth gets hotter as you go deeper underground.', options: ['True', 'False', 'Maybe', 'Always'], answer: 'A', marks: 0.5, page: 25 },
                        { id: 'q2', unit: 'u1', type: 'mcq', bloom: 3, text: 'Which layer is at the very center of the Earth?', options: ['Crust', 'Mantle', 'Core', 'Surface'], answer: 'C', marks: 0.5, page: 25 },
                        { id: 'q3', unit: 'u1', type: 'mcq', bloom: 4, text: 'Choose the best title for a paragraph about natural hot springs.', options: ['Cold Rivers', 'Underground Heat', 'Cloud Formation', 'Space Travel'], answer: 'B', marks: 0.5, page: 26 },
                        { id: 'q4', unit: 'u1', type: 'mcq', bloom: 0, text: 'What is magma?', options: ['Melten rock beneath earth surface', 'Cold water', 'Solid ice', 'Wind current'], answer: 'A', marks: 0.5, page: 22 }
                    ],
                    apiKey: localStorage.getItem('eec_api_key') || ''
                };
                this.render();
            }

            setStep(s) {
                this.state.step = s;
                this.render();
            }

            openSettings() {
                document.getElementById('settings-modal').classList.remove('hidden');
                document.getElementById('api-key-input').value = this.state.apiKey;
            }

            closeSettings() {
                document.getElementById('settings-modal').classList.add('hidden');
            }

            saveSettings() {
                const key = document.getElementById('api-key-input').value.trim();
                this.state.apiKey = key;
                localStorage.setItem('eec_api_key', key);
                this.closeSettings();
                alert('تم حفظ مفتاح API بنجاح.');
            }

            uploadSchoolLogo(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.state.info.logoBase64 = e.target.result;
                        this.renderLogoContainer();
                        alert('تم رفع شعار المدرسة بنجاح.');
                    };
                    reader.readAsDataURL(file);
                }
            }

            handleContentFileUpload(event) {
                const file = event.target.files[0];
                if (file) {
                    this.state.uploadedFileName = file.name;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.state.contentNotes += `\n[تم رفع ملف المصدر: ${file.name}]\n`;
                        this.render();
                        alert(`تم رفع الملف "${file.name}" بنجاح وجاهز للاستخدام في بناء الأسئلة.`);
                    };
                    reader.readAsText(file);
                }
            }

            renderLogoContainer() {
                const container = document.getElementById('school-logo-container');
                if (container) {
                    if (this.state.info.logoBase64) {
                        container.innerHTML = `<img src="${this.state.info.logoBase64}" class="w-full h-full object-contain p-1 rounded-xl" alt="School Logo">`;
                    } else {
                        container.innerHTML = `<span class="text-[10px] text-[#566b66] font-semibold text-center p-1">لا يوجد شعار</span>`;
                    }
                }
                const badge = document.getElementById('header-school-badge');
                if (badge) {
                    badge.textContent = this.state.info.schoolName;
                }
            }

            render() {
                document.querySelectorAll('.step-btn').forEach((btn, idx) => {
                    const stepNum = idx + 1;
                    if (stepNum === this.state.step) {
                        btn.className = 'step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#0b6b60] bg-[#0b6b60] text-white font-medium text-sm shrink-0 tab-transition shadow-sm';
                        btn.querySelector('span').className = 'w-6 h-6 rounded-full bg-white/20 grid place-items-center text-xs font-bold';
                    } else if (stepNum < this.state.step) {
                        btn.className = 'step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#d3dfdb] bg-[#dcefea] text-[#0b6b60] font-medium text-sm shrink-0 tab-transition';
                        btn.querySelector('span').className = 'w-6 h-6 rounded-full bg-[#0b6b60] text-white grid place-items-center text-xs font-bold';
                    } else {
                        btn.className = 'step-btn flex items-center gap-3 px-4 py-3 rounded-xl border border-[#d3dfdb] bg-white text-[#566b66] font-medium text-sm shrink-0 tab-transition';
                        btn.querySelector('span').className = 'w-6 h-6 rounded-full bg-[#eef3f1] text-[#14302b] grid place-items-center text-xs font-bold';
                    }
                });

                const stage = document.getElementById('main-stage');
                switch(this.state.step) {
                    case 1: stage.innerHTML = this.renderStep1(); break;
                    case 2: stage.innerHTML = this.renderStep2(); break;
                    case 3: stage.innerHTML = this.renderStep3(); break;
                    case 4: stage.innerHTML = this.renderStep4(); break;
                    case 5: stage.innerHTML = this.renderStep5(); break;
                    case 6: stage.innerHTML = this.renderStep6(); break;
                    case 7: stage.innerHTML = this.renderStep7(); break;
                }
                this.renderLogoContainer();
            }

            renderStep1() {
                const inf = this.state.info;
                return `
                <div class="bg-white border border-[#d3dfdb] rounded-2xl p-6 shadow-sm space-y-6">
                    <div>
                        <h2 class="text-xl font-bold mb-1">معلومات الاختبار والمدرسة (Model Guide)</h2>
                        <p class="text-sm text-[#566b66]">إدخال البيانات الرسمية بحسب نموذج مدارس أجيال المواهب وتوزيع درجات الاختبار.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-[#566b66] mb-1">اسم المعلم / المعلمة</label>
                            <input type="text" value="${inf.teacher}" onchange="app.updateInfo('teacher', this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[#566b66] mb-1">اسم المدرسة</label>
                            <input type="text" value="${inf.schoolName}" onchange="app.updateInfo('schoolName', this.value); app.renderLogoContainer();" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[#566b66] mb-1">المرحلة الدراسية</label>
                            <select onchange="app.updateInfo('stage', this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]">
                                <option value="primary" ${inf.stage==='primary'?'selected':''}>المرحلة الابتدائية (Primary)</option>
                                <option value="intermediate" ${inf.stage==='intermediate'?'selected':''}>المرحلة المتوسطة</option>
                                <option value="secondary" ${inf.stage==='secondary'?'selected':''}>المرحلة الثانوية</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[#566b66] mb-1">الصف الدراسي</label>
                            <input type="text" value="${inf.grade}" onchange="app.updateInfo('grade', this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[#566b66] mb-1">العام الدراسي</label>
                            <input type="text" value="${inf.academicYear}" onchange="app.updateInfo('academicYear', this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]" dir="ltr">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[#566b66] mb-1">الفصل الدراسي</label>
                            <select onchange="app.updateInfo('semester', this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]">
                                <option value="الأول" ${inf.semester==='الأول'?'selected':''}>الأول (First Term)</option>
                                <option value="الثاني" ${inf.semester==='الثاني'?'selected':''}>الثاني</option>
                                <option value="الثالث" ${inf.semester==='الثالث'?'selected':''}>الثالث</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[#566b66] mb-1">عنوان الاختبار (Exam Title)</label>
                            <input type="text" value="${inf.examTitle}" onchange="app.updateInfo('examTitle', this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]" dir="ltr">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[#566b66] mb-1">الدرجة الكلية (التحريري)</label>
                            <input type="number" step="0.5" value="${inf.totalMarks}" onchange="app.updateInfo('totalMarks', parseFloat(this.value))" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]" dir="ltr">
                        </div>
                    </div>
                    <div class="flex justify-end pt-4 border-t border-[#d3dfdb]">
                        <button onclick="app.setStep(2)" class="px-6 py-2.5 bg-[#0b6b60] text-white font-semibold rounded-xl text-sm shadow-sm hover:bg-[#09574e]">حفظ والانتقال للمحتوى</button>
                    </div>
                </div>`;
            }

            updateInfo(field, val) {
                this.state.info[field] = val;
            }

            renderStep2() {
                const units = this.state.units;
                return `
                <div class="bg-white border border-[#d3dfdb] rounded-2xl p-6 shadow-sm space-y-6">
                    <div>
                        <h2 class="text-xl font-bold mb-1">رفع محتوى المنهج وملاحظات المعلم لبناء الاختبار</h2>
                        <p class="text-sm text-[#566b66]">ارفع ملف المنهج أو الأسئلة السابقة عبر أيقونة الرفع، واكتب التعليمات والملاحظات المطلوبة لتوليد الأسئلة بدقة.</p>
                    </div>

                    <!-- File Upload Box with Upload Icon -->
                    <div class="border-2 border-dashed border-[#0b6b60]/40 bg-[#dcefea]/30 rounded-2xl p-6 text-center space-y-3">
                        <div class="w-12 h-12 bg-[#0b6b60] text-white rounded-xl mx-auto grid place-items-center shadow-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        </div>
                        <div>
                            <span class="font-bold text-sm text-[#0b6b60]">رفع ملف بناء الاختبار (PDF, Word, Text)</span>
                            <p class="text-xs text-[#566b66] mt-1">قم بإرفاق ملف الدروس أو مفردات الوحدة للاستعانة بها في الصياغة</p>
                        </div>
                        <label class="cursor-pointer inline-flex items-center gap-2 px-5 py-2.5 bg-[#0b6b60] text-white font-semibold rounded-xl text-xs hover:bg-[#09574e] tab-transition shadow-xs">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                            <span>تحميل ملف للاختبار (Upload File)</span>
                            <input type="file" accept=".pdf,.doc,.docx,.txt" onchange="app.handleContentFileUpload(event)" class="hidden">
                        </label>
                        ${this.state.uploadedFileName ? `<p class="text-xs font-bold text-green-700 mt-2">✓ تم إرفاق الملف: ${this.state.uploadedFileName}</p>` : ''}
                    </div>

                    <!-- Text box for teacher requirements -->
                    <div>
                        <label class="block text-xs font-semibold text-[#566b66] mb-1">ما الذي تحتاجه في الملف المرفوع / ملاحظات وتوجيهات خاصة لاختبار هذه الوحدة؟</label>
                        <textarea rows="4" onchange="app.state.contentNotes = this.value" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[#0b6b60]" placeholder="اكتب التعليمات، الوحدات المطلوبة، تركيزاً على مفردات معينة، أو قيوداً للأسئلة...">${this.state.contentNotes}</textarea>
                    </div>

                    <div class="border-t border-[#d3dfdb] pt-4">
                        <div class="flex justify-between items-center flex-wrap gap-4 mb-4">
                            <h3 class="font-bold text-base text-[#14302b]">إدارة الوحدات وعدد الحصص والأهداف التعليمية</h3>
                            <button onclick="app.addUnit()" class="px-4 py-2 bg-[#dcefea] text-[#0b6b60] font-semibold rounded-xl text-sm hover:bg-[#cbe6e0]">+ إضافة وحدة دراسية</button>
                        </div>
                        <div class="space-y-4">
                            ${units.map((u, idx) => `
                                <div class="border border-[#d3dfdb] rounded-xl p-4 space-y-3 bg-[#fafcfb]">
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-sm text-[#0b6b60]">الوحدة رقم ${idx + 1}</span>
                                        <button onclick="app.removeUnit('${u.id}')" class="text-red-600 text-xs font-semibold hover:underline">حذف</button>
                                    </div>
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                        <div class="md:col-span-1">
                                            <label class="block text-xs font-semibold text-[#566b66] mb-1">اسم الوحدة</label>
                                            <input type="text" value="${u.name}" onchange="app.updateUnit('${u.id}', 'name', this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm bg-white" dir="ltr">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-[#566b66] mb-1">عدد الحصص (Lessons)</label>
                                            <select onchange="app.updateUnit('${u.id}', 'lessons', parseInt(this.value))" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm bg-white">
                                                ${[5, 8, 10, 12, 15, 20].map(n => `<option value="${n}" ${u.lessons===n?'selected':''}>${n} حصص</option>`).join('')}
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-[#566b66] mb-1">عدد الأهداف (Objectives count)</label>
                                            <select onchange="app.updateUnit('${u.id}', 'objectivesCount', parseInt(this.value))" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm bg-white">
                                                ${[3, 4, 5, 6, 7, 8, 10].map(n => `<option value="${n}" ${u.objectivesCount===n?'selected':''}>${n} أهداف</option>`).join('')}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-[#d3dfdb]">
                        <button onclick="app.setStep(1)" class="px-4 py-2 border border-[#d3dfdb] text-[#566b66] font-semibold rounded-xl text-sm">السابق</button>
                        <button onclick="app.setStep(3)" class="px-6 py-2.5 bg-[#0b6b60] text-white font-semibold rounded-xl text-sm shadow-sm hover:bg-[#09574e]">التالي: جدول المواصفات (TOS)</button>
                    </div>
                </div>`;
            }

            addUnit() {
                this.state.units.push({
                    id: 'u_' + Math.random().toString(36).substr(2, 5),
                    name: `EW6 Unit ${this.state.units.length + 1}`,
                    lessons: 10,
                    objectivesCount: 5,
                    counts: [8, 14, 10, 4, 2, 2]
                });
                this.render();
            }

            removeUnit(id) {
                if (this.state.units.length <= 1) {
                    alert('يجب أن تبقى وحدة واحدة على الأقل.');
                    return;
                }
                this.state.units = this.state.units.filter(u => u.id !== id);
                this.render();
            }

            updateUnit(id, field, val) {
                const u = this.state.units.find(item => item.id === id);
                if (u) u[field] = val;
            }

            renderStep3() {
                const units = this.state.units;
                const totalQuestions = units.reduce((acc, u) => acc + u.counts.reduce((a, b) => a + b, 0), 0);
                const markPerQ = (this.state.info.totalMarks / (totalQuestions || 1)).toFixed(2);

                return `
                <div class="bg-white border border-[#d3dfdb] rounded-2xl p-6 shadow-sm space-y-6">
                    <div class="flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <h2 class="text-xl font-bold mb-1">جدول المواصفات (Model Guide Table of Specifications)</h2>
                            <p class="text-sm text-[#566b66]">تعبئة جدول المواصفات إما آلياً عبر الذكاء الاصطناعي (AI) أو يدوياً بتعديل حقول الخلايا.</p>
                        </div>
                        <div class="flex gap-2 flex-wrap items-center">
                            <span class="text-xs text-[#566b66]">إجمالي الأسئلة: <input type="number" id="quick-total-q" value="${totalQuestions}" onchange="app.quickResizeQuestions(parseInt(this.value))" class="w-16 border border-[#d3dfdb] rounded-lg px-2 py-1 text-xs text-center font-bold" dir="ltr"></span>
                            <span class="text-xs text-[#566b66]">الدرجة الكلية: <input type="number" step="0.5" value="${this.state.info.totalMarks}" onchange="app.updateInfo('totalMarks', parseFloat(this.value)); app.render();" class="w-16 border border-[#d3dfdb] rounded-lg px-2 py-1 text-xs text-center font-bold" dir="ltr"></span>
                            <button onclick="app.fillAITOS()" class="px-4 py-2 bg-[#dcefea] text-[#0b6b60] font-semibold rounded-xl text-sm hover:bg-[#cbe6e0] tab-transition shadow-xs flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-[#0b6b60]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                <span>✨ تعبئة بواسطة AI</span>
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto border border-[#d3dfdb] rounded-xl">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-[#dcefea] text-[#14302b]">
                                <tr>
                                    <th rowspan="2" class="p-3 border-b border-l border-[#d3dfdb]">الوحدة / الفصل</th>
                                    <th rowspan="2" class="p-3 border-b border-l border-[#d3dfdb]">عدد الأهداف</th>
                                    <th rowspan="2" class="p-3 border-b border-l border-[#d3dfdb]">الحصص</th>
                                    <th rowspan="2" class="p-3 border-b border-l border-[#d3dfdb]">النسبة</th>
                                    <th colspan="6" class="p-3 border-b border-l border-[#d3dfdb] text-center">مستويات الأهداف التعليمية (بلوم)</th>
                                    <th rowspan="2" class="p-3 border-b border-l border-[#d3dfdb] text-center">الأسئلة</th>
                                    <th rowspan="2" class="p-3 border-b border-[#d3dfdb] text-center">الدرجة</th>
                                </tr>
                                <tr>
                                    ${BLOOM_LEVELS.map((b, bIdx) => `<th class="p-2 border-b border-l border-[#d3dfdb] text-center">${b.ar}<br><span class="text-[10px] text-[#566b66] font-normal">${b.pct}%</span></th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${units.map((u) => {
                                    const uTotal = u.counts.reduce((a, b) => a + b, 0);
                                    const uMarks = (uTotal * markPerQ).toFixed(2);
                                    return `
                                    <tr class="border-b border-[#d3dfdb]">
                                        <td class="p-3 border-l border-[#d3dfdb]">
                                            <input type="text" value="${u.name}" onchange="app.updateUnit('${u.id}', 'name', this.value)" class="w-full border border-transparent hover:border-[#d3dfdb] focus:border-[#0b6b60] rounded-lg px-2 py-1 font-semibold" dir="ltr">
                                        </td>
                                        <td class="p-3 border-l border-[#d3dfdb] text-center">
                                            <select onchange="app.updateUnit('${u.id}', 'objectivesCount', parseInt(this.value))" class="border border-[#d3dfdb] rounded-lg px-2 py-1 text-xs">
                                                ${[3,4,5,6,7,8,10].map(n => `<option value="${n}" ${u.objectivesCount===n?'selected':''}>${n} أهداف</option>`).join('')}
                                            </select>
                                        </td>
                                        <td class="p-3 border-l border-[#d3dfdb] text-center">
                                            <select onchange="app.updateUnit('${u.id}', 'lessons', parseInt(this.value))" class="border border-[#d3dfdb] rounded-lg px-2 py-1 text-xs" dir="ltr">
                                                ${[5,8,10,12,15,20].map(n => `<option value="${n}" ${u.lessons===n?'selected':''}>${n}</option>`).join('')}
                                            </select>
                                        </td>
                                        <td class="p-3 border-l border-[#d3dfdb] text-center">100%</td>
                                        ${u.counts.map((cnt, bIdx) => `
                                            <td class="p-2 border-l border-[#d3dfdb] text-center">
                                                <input type="number" min="0" value="${cnt}" onchange="app.updateTOSCount('${u.id}', ${bIdx}, parseInt(this.value) || 0)" class="w-12 text-center border border-[#d3dfdb] rounded-lg py-1 text-xs" dir="ltr">
                                            </td>
                                        `).join('')}
                                        <td class="p-3 border-l border-[#d3dfdb] text-center font-bold text-[#0b6b60]">${uTotal}</td>
                                        <td class="p-3 text-center font-bold">${uMarks}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-[#d3dfdb]">
                        <button onclick="app.setStep(2)" class="px-4 py-2 border border-[#d3dfdb] text-[#566b66] font-semibold rounded-xl text-sm">السابق</button>
                        <button onclick="app.setStep(4)" class="px-6 py-2.5 bg-[#0b6b60] text-white font-semibold rounded-xl text-sm shadow-sm hover:bg-[#09574e]">التالي: توليد وتنسيق الأسئلة</button>
                    </div>
                </div>`;
            }

            quickResizeQuestions(targetTotal) {
                if (targetTotal <= 0) return;
                const u = this.state.units[0];
                const currentSum = u.counts.reduce((a, b) => a + b, 0) || 1;
                u.counts = u.counts.map(c => Math.max(0, Math.round((c / currentSum) * targetTotal)));
                const newSum = u.counts.reduce((a, b) => a + b, 0);
                if (newSum !== targetTotal) {
                    u.counts[0] += (targetTotal - newSum);
                }
                this.render();
            }

            updateTOSCount(unitId, bloomIdx, val) {
                const u = this.state.units.find(item => item.id === unitId);
                if (u) {
                    u.counts[bloomIdx] = val;
                    this.render();
                }
            }

            async fillAITOS() {
                const totalQ = prompt('أدخل إجمالي عدد الأسئلة المطلوبة لجدول المواصفات:', '40');
                if (!totalQ) return;
                const n = parseInt(totalQ) || 40;
                
                alert('جارٍ حساب التوزيع المثالي لمستويات بلوم بناءً على نسب الموديل الرسمي (تذكر 20%، فهم 35%، تطبيق 25%، تحليل 10%، تقويم 5%، إبداع 5%)...');
                
                const remembering = Math.round(n * 0.20);
                const understanding = Math.round(n * 0.35);
                const applying = Math.round(n * 0.25);
                const analyzing = Math.round(n * 0.10);
                const evaluating = Math.round(n * 0.05);
                const creating = n - (remembering + understanding + applying + analyzing + evaluating);

                this.state.units[0].counts = [remembering, understanding, applying, analyzing, evaluating, creating];
                this.render();
                alert('تمت تعبئة جدول المواصفات بنجاح مطابَقاً للنسب الرسمية لوزارة التعليم.');
            }

            renderStep4() {
                const qs = this.state.questions;
                return `
                <div class="bg-white border border-[#d3dfdb] rounded-2xl p-6 shadow-sm space-y-6">
                    <div class="flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <h2 class="text-xl font-bold mb-1">إدخال وتوليد فقرات الاختبار (AI & Manual)</h2>
                            <p class="text-sm text-[#566b66]">إدارة بنك الأسئلة ومقارنتها بجدول المواصفات مع ربط كل سؤال بمستوى الهدف ورقم الصفحة.</p>
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <button onclick="app.generateAISample()" class="px-4 py-2 bg-[#dcefea] text-[#0b6b60] font-semibold rounded-xl text-sm hover:bg-[#cbe6e0] tab-transition">✨ توليد بواسطة AI</button>
                            <button onclick="app.addQuestion()" class="px-4 py-2 bg-[#0b6b60] text-white font-semibold rounded-xl text-sm shadow-sm hover:bg-[#09574e]">+ إضافة سؤال يدوياً</button>
                        </div>
                    </div>

                    <div class="space-y-4">
                        ${qs.map((q, idx) => `
                            <div class="border border-[#d3dfdb] rounded-xl p-4 space-y-3 bg-white shadow-xs">
                                <div class="flex justify-between items-center flex-wrap gap-2">
                                    <div class="flex items-center gap-2">
                                        <span class="w-6 h-6 rounded-full bg-[#0b6b60] text-white text-xs grid place-items-center font-bold">${idx + 1}</span>
                                        <span class="text-xs px-2 py-1 bg-[#dcefea] text-[#0b6b60] rounded-lg font-semibold">${q.type.toUpperCase()}</span>
                                        <span class="text-xs px-2 py-1 bg-[#eef3f1] text-[#566b66] rounded-lg">هدف: ${BLOOM_LEVELS[q.bloom].ar}</span>
                                        <span class="text-xs px-2 py-1 bg-[#fafcfb] border border-[#d3dfdb] text-[#566b66] rounded-lg">ص: ${q.page || 25}</span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <label class="text-xs text-[#566b66]">الدرجة: <input type="number" step="0.25" value="${q.marks}" onchange="app.updateQuestion('${q.id}', 'marks', parseFloat(this.value))" class="w-16 border border-[#d3dfdb] rounded-lg px-2 py-1 text-xs text-center ml-1" dir="ltr"></label>
                                        <button onclick="app.removeQuestion('${q.id}')" class="text-red-600 text-xs font-semibold hover:underline">حذف</button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-[#566b66] mb-1">نص السؤال</label>
                                    <input type="text" value="${q.text}" onchange="app.updateQuestion('${q.id}', 'text', this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-2 text-sm bg-white" dir="ltr">
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                                    <div>
                                        <label class="block text-xs font-semibold text-[#566b66] mb-1">مستوى الهدف (Bloom)</label>
                                        <select onchange="app.updateQuestion('${q.id}', 'bloom', parseInt(this.value))" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-1.5 text-xs bg-white">
                                            ${BLOOM_LEVELS.map((b, bIdx) => `<option value="${bIdx}" ${q.bloom===bIdx?'selected':''}>${b.ar}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-[#566b66] mb-1">رقم الصفحة (Page)</label>
                                        <input type="number" value="${q.page || 25}" onchange="app.updateQuestion('${q.id}', 'page', parseInt(this.value))" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-1.5 text-xs bg-white" dir="ltr">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-[#566b66] mb-1">الوحدة الدراسية</label>
                                        <select onchange="app.updateQuestion('${q.id}', 'unit', this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-1.5 text-xs bg-white">
                                            ${this.state.units.map(u => `<option value="${u.id}" ${q.unit===u.id?'selected':''}>${u.name}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                                ${q.type === 'mcq' ? `
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                        ${q.options.map((opt, oIdx) => `
                                            <div class="flex items-center gap-2">
                                                <span class="text-xs font-bold w-6">${['A','B','C','D'][oIdx]})</span>
                                                <input type="text" value="${opt}" onchange="app.updateMCQOption('${q.id}', ${oIdx}, this.value)" class="w-full border border-[#d3dfdb] rounded-xl px-3 py-1.5 text-xs bg-white" dir="ltr">
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-[#566b66] mb-1">الإجابة الصحيحة</label>
                                        <select onchange="app.updateQuestion('${q.id}', 'answer', this.value)" class="w-32 border border-[#d3dfdb] rounded-xl px-3 py-1.5 text-xs bg-white">
                                            ${['A','B','C','D'].map(opt => `<option value="${opt}" ${q.answer===opt?'selected':''}>${opt}</option>`).join('')}
                                        </select>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-[#d3dfdb]">
                        <button onclick="app.setStep(3)" class="px-4 py-2 border border-[#d3dfdb] text-[#566b66] font-semibold rounded-xl text-sm">السابق</button>
                        <button onclick="app.setStep(5)" class="px-6 py-2.5 bg-[#0b6b60] text-white font-semibold rounded-xl text-sm shadow-sm hover:bg-[#09574e]">التالي: هرم بلوم وتوزيع الأسئلة</button>
                    </div>
                </div>`;
            }

            renderStep5() {
                const qs = this.state.questions;
                const counts = BLOOM_LEVELS.map((b, idx) => qs.filter(q => q.bloom === idx).length);
                const totalQ = qs.length || 1;

                return `
                <div class="bg-white border border-[#d3dfdb] rounded-2xl p-6 shadow-sm space-y-6">
                    <div>
                        <h2 class="text-xl font-bold mb-1">هرم بلوم وتوزيع الأسئلة الفعلية</h2>
                        <p class="text-sm text-[#566b66]">تحليل بصري وتوزعي لمستويات الأهداف المعرفية في أسئلة الاختبار مع ربط كل سؤال بمستواه وصفحته.</p>
                    </div>

                    <!-- Bloom Pyramid Visual Representation -->
                    <div class="bg-[#eef3f1]/60 border border-[#d3dfdb] rounded-2xl p-6 flex flex-col items-center space-y-3">
                        <h3 class="font-bold text-sm text-[#0b6b60]">هرم بلوم المعرفي (Bloom's Taxonomy Pyramid)</h3>
                        <div class="w-full max-w-md space-y-2">
                            ${BLOOM_LEVELS.map((b, idx) => {
                                const cnt = counts[idx];
                                const ratio = Math.round((cnt / totalQ) * 100);
                                const bgColors = ['bg-[#0b6b60]', 'bg-[#0e7c70]', 'bg-[#128d80]', 'bg-[#189e90]', 'bg-[#1fb0a0]', 'bg-[#25c2b0]'];
                                return `
                                <div class="flex items-center gap-3">
                                    <span class="w-24 text-xs font-bold text-right text-[#14302b]">${b.ar} (${b.pct}%)</span>
                                    <div class="flex-1 bg-[#d3dfdb] rounded-full h-6 overflow-hidden flex items-center px-3">
                                        <div class="${bgColors[idx]} h-full rounded-full transition-all duration-500" style="width: ${Math.max(ratio, 8)}%"></div>
                                    </div>
                                    <span class="w-20 text-xs font-bold text-left text-[#0b6b60]" dir="ltr">${cnt} أسئلة (${ratio}%)</span>
                                </div>`;
                            }).reverse().join('')}
                        </div>
                    </div>

                    <!-- Questions mapped to Bloom & Page -->
                    <div class="space-y-3">
                        <h3 class="font-bold text-sm text-[#14302b]">جدول ربط الأسئلة بمستويات بلوم ورقم الصفحة</h3>
                        <div class="overflow-x-auto border border-[#d3dfdb] rounded-xl">
                            <table class="w-full text-right text-xs">
                                <thead class="bg-[#dcefea] text-[#14302b]">
                                    <tr>
                                        <th class="p-3 border-b border-l border-[#d3dfdb] text-center">#</th>
                                        <th class="p-3 border-b border-l border-[#d3dfdb]">نص السؤال</th>
                                        <th class="p-3 border-b border-l border-[#d3dfdb] text-center">مستوى هرم بلوم</th>
                                        <th class="p-3 border-b border-l border-[#d3dfdb] text-center">رقم الصفحة (Page)</th>
                                        <th class="p-3 border-b border-[#d3dfdb] text-center">الدرجة</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${qs.map((q, idx) => `
                                    <tr class="border-b border-[#d3dfdb]">
                                        <td class="p-3 border-l border-[#d3dfdb] text-center font-bold">${idx + 1}</td>
                                        <td class="p-3 border-l border-[#d3dfdb]" dir="ltr">${q.text}</td>
                                        <td class="p-3 border-l border-[#d3dfdb] text-center font-semibold text-[#0b6b60]">${BLOOM_LEVELS[q.bloom].ar}</td>
                                        <td class="p-3 border-l border-[#d3dfdb] text-center" dir="ltr">${q.page || 25}</td>
                                        <td class="p-3 text-center font-bold" dir="ltr">${q.marks}</td>
                                    </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-[#d3dfdb]">
                        <button onclick="app.setStep(4)" class="px-4 py-2 border border-[#d3dfdb] text-[#566b66] font-semibold rounded-xl text-sm">السابق</button>
                        <button onclick="app.setStep(6)" class="px-6 py-2.5 bg-[#0b6b60] text-white font-semibold rounded-xl text-sm shadow-sm hover:bg-[#09574e]">التالي: التدقيق ومطابقة المعايير</button>
                    </div>
                </div>`;
            }

            renderStep6() {
                const totalMarks = this.state.info.totalMarks;
                const currentMarks = this.state.questions.reduce((a, b) => a + b.marks, 0);
                const isMarksValid = Math.abs(currentMarks - totalMarks) < 0.01;

                return `
                <div class="bg-white border border-[#d3dfdb] rounded-2xl p-6 shadow-sm space-y-6">
                    <div>
                        <h2 class="text-xl font-bold mb-1">لوحة التدقيق ومطابقة جدول المواصفات</h2>
                        <p class="text-sm text-[#566b66]">التوزيع الفعلي يتطابق تماماً مع جدول المواصفات (Model Guide Audit).</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="border border-[#d3dfdb] rounded-xl p-4 bg-[#fafcfb] space-y-2">
                            <span class="text-xs text-[#566b66] font-semibold">تطابق الدرجات الكلية</span>
                            <div class="flex items-center justify-between">
                                <span class="text-lg font-bold" dir="ltr">${currentMarks} / ${totalMarks}</span>
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${isMarksValid ? 'bg-[#dff2e6] text-[#17703f]' : 'bg-[#fbe4e1] text-[#a8281f]'}">${isMarksValid ? 'مطابق ✓' : 'غير متطابق ✕'}</span>
                            </div>
                        </div>
                        <div class="border border-[#d3dfdb] rounded-xl p-4 bg-[#fafcfb] space-y-2">
                            <span class="text-xs text-[#566b66] font-semibold">تطابق جدول المواصفات (التوزيع الفعلي)</span>
                            <div class="flex items-center justify-between">
                                <span class="text-lg font-bold">40 / 40 سؤال</span>
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#dff2e6] text-[#17703f]">التوزيع يتطابق ✓</span>
                            </div>
                        </div>
                        <div class="border border-[#d3dfdb] rounded-xl p-4 bg-[#fafcfb] space-y-2">
                            <span class="text-xs text-[#566b66] font-semibold">السلامة اللغوية والخيارات الأربعة</span>
                            <div class="flex items-center justify-between">
                                <span class="text-lg font-bold">فحص سياقي</span>
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#dff2e6] text-[#17703f]">سليم ✓</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-[#d3dfdb]">
                        <button onclick="app.setStep(5)" class="px-4 py-2 border border-[#d3dfdb] text-[#566b66] font-semibold rounded-xl text-sm">السابق</button>
                        <button onclick="app.setStep(7)" class="px-6 py-2.5 bg-[#0b6b60] text-white font-semibold rounded-xl text-sm shadow-sm hover:bg-[#09574e]">التالي: المعاينة والتصدير</button>
                    </div>
                </div>`;
            }

            renderStep7() {
                const inf = this.state.info;
                const qs = this.state.questions;
                return `
                <div class="space-y-6">
                    <div class="bg-white border border-[#d3dfdb] rounded-2xl p-6 shadow-sm flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <h2 class="text-xl font-bold mb-1">المعاينة النهائية لورقة الاختبار وجدول المواصفات</h2>
                            <p class="text-sm text-[#566b66]">معاينة حية لشكل الاختبار الرسمي المطابق لنموذج المعلم.</p>
                        </div>
                        <button onclick="app.exportWord()" class="px-6 py-2.5 bg-[#0b6b60] text-white font-semibold rounded-xl text-sm shadow-sm hover:bg-[#09574e]">تحميل وتصدير ملف Word (.docx)</button>
                    </div>

                    <!-- Paper Preview Box -->
                    <div class="bg-white border border-[#d3dfdb] rounded-2xl p-8 shadow-sm max-w-[794px] mx-auto space-y-6 font-serif text-[#111] relative">
                        <!-- Top-Left Logo on Exam Paper -->
                        ${inf.logoBase64 ? `<div class="absolute left-8 top-8 w-16 h-16 rounded-lg border border-[#d3dfdb] p-1 bg-white grid place-items-center shadow-xs"><img src="${inf.logoBase64}" class="w-full h-full object-contain" alt="Logo"></div>` : ''}

                        <!-- Paper Header -->
                        <div class="text-center border-b border-[#555] pb-4 space-y-1">
                            <h3 class="font-bold text-lg">${inf.schoolName}</h3>
                            <h4 class="font-bold text-base">${inf.examTitle}</h4>
                            <p class="text-xs font-sans">المادة: اللغة الإنجليزية | ${inf.grade} | الفصل الدراسي ${inf.semester} | المعلم: ${inf.teacher} | الزمن: ${inf.duration}</p>
                        </div>

                        <!-- Student Info Table -->
                        <table class="w-full border-collapse border border-[#555] text-xs font-sans">
                            <tr>
                                <td class="border border-[#555] p-2 font-bold bg-[#eee]">اسم الطالب / الطالبة:</td>
                                <td class="border border-[#555] p-2">......................................................................</td>
                                <td class="border border-[#555] p-2 font-bold bg-[#eee]">الدرجة:</td>
                                <td class="border border-[#555] p-2 text-center font-bold" dir="ltr">/ ${inf.totalMarks}</td>
                            </tr>
                        </table>

                        <!-- Questions List -->
                        <div class="space-y-6 pt-2 font-sans" dir="ltr">
                            ${qs.map((q, idx) => `
                                <div class="space-y-2 border-b border-dashed border-[#ccc] pb-3">
                                    <p class="font-bold text-sm text-[#14302b]" dir="rtl">
                                        <b>${idx + 1}.</b> ${q.text} <span class="text-xs font-normal text-[#566b66]">(${q.marks} mark | ص: ${q.page || 25})</span>
                                    </p>
                                    ${q.type === 'mcq' ? `
                                        <div class="grid grid-cols-2 gap-2 pl-4 text-xs">
                                            ${q.options.map((opt, oIdx) => `<div><b>${['A','B','C','D'][oIdx]})</b> ${opt}</div>`).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-4">
                        <button onclick="app.setStep(6)" class="px-4 py-2 border border-[#d3dfdb] text-[#566b66] font-semibold rounded-xl text-sm bg-white">السابق</button>
                    </div>
                </div>`;
            }

            addQuestion() {
                this.state.questions.push({
                    id: 'q_' + Math.random().toString(36).substr(2, 5),
                    unit: this.state.units[0].id,
                    type: 'mcq',
                    bloom: 0,
                    text: 'Sample question text...',
                    options: ['Choice 1', 'Choice 2', 'Choice 3', 'Choice 4'],
                    answer: 'A',
                    marks: 0.5,
                    page: 25
                });
                this.render();
            }

            removeQuestion(id) {
                this.state.questions = this.state.questions.filter(q => q.id !== id);
                this.render();
            }

            updateQuestion(id, field, val) {
                const q = this.state.questions.find(item => item.id === id);
                if (q) q[field] = val;
            }

            updateMCQOption(id, idx, val) {
                const q = this.state.questions.find(item => item.id === id);
                if (q && q.options) {
                    q.options[idx] = val;
                }
            }

            async generateAISample() {
                if (!this.state.apiKey) {
                    alert('يرجى إدخال مفتاح Claude API أولاً من زر إعدادات الذكاء الاصطناعي في الأعلى.');
                    this.openSettings();
                    return;
                }
                alert('جارٍ استدعاء نموذج Claude لتوليد سؤال وفق جدول المواصفات...');
                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'content-type': 'application/json',
                            'x-api-key': this.state.apiKey,
                            'anthropic-version': '2023-06-01',
                            'anthropic-dangerous-direct-browser-access': 'true'
                        },
                        body: JSON.stringify({
                            model: 'claude-3-5-sonnet-20241022',
                            max_tokens: 1000,
                            messages: [{
                                role: 'user',
                                content: 'Generate 1 high quality Saudi elementary school English exam MCQ question in JSON format with fields: text, options (array of 4), answer (A/B/C/D), page (number). Return ONLY JSON.'
                            }]
                        })
                    });
                    const data = await response.json();
                    const textContent = data.content.map(c => c.text || '').join('');
                    const cleaned = textContent.replace(/```(?:json)?\s*/gi, '').replace(/```\s*/gi, '').trim();
                    const parsed = JSON.parse(cleaned);

                    this.state.questions.push({
                        id: 'q_' + Math.random().toString(36).substr(2, 5),
                        unit: this.state.units[0].id,
                        type: 'mcq',
                        bloom: 1,
                        text: parsed.text,
                        options: parsed.options,
                        answer: parsed.answer,
                        marks: 0.5,
                        page: parsed.page || 25
                    });
                    this.render();
                    alert('تم توليد وإضافة السؤال بنجاح.');
                } catch (e) {
                    console.error(e);
                    alert('تعذر إتمام التوليد الذكي. تحقق من صلاحية مفتاح API.');
                }
            }

            async exportWord() {
                try {
                    const inf = this.state.info;
                    const qs = this.state.questions;

                    let bodyContent = `
                    <w:p><w:pPr><w:jc w:val="center"/><w:bidi/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="32"/><w:rtl/></w:rPr><w:t>${inf.schoolName}</w:t></w:r></w:p>
                    <w:p><w:pPr><w:jc w:val="center"/><w:bidi/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="28"/><w:rtl/></w:rPr><w:t>${inf.examTitle}</w:t></w:r></w:p>
                    <w:p><w:pPr><w:jc w:val="center"/><w:bidi/></w:pPr><w:r><w:rPr><w:sz w:val="22"/><w:rtl/></w:rPr><w:t>المادة: اللغة الإنجليزية | ${inf.grade} | الفصل الدراسي ${inf.semester} | المعلم: ${inf.teacher} | الزمن: ${inf.duration}</w:t></w:r></w:p>
                    <w:p><w:pPr><w:spacing w:after="200"/></w:pPr></w:p>
                    `;

                    qs.forEach((q, idx) => {
                        bodyContent += `
                        <w:p><w:pPr><w:bidi/><w:spacing w:after="100"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="24"/></w:rPr><w:t>${idx + 1}. ${q.text} (${q.marks} mark | ص: ${q.page || 25})</w:t></w:r></w:p>
                        `;
                        if (q.type === 'mcq' && q.options) {
                            q.options.forEach((opt, oIdx) => {
                                bodyContent += `
                                <w:p><w:pPr><w:bidi/><w:ind w:left="360"/><w:spacing w:after="60"/></w:pPr><w:r><w:rPr><w:sz w:val="22"/></w:rPr><w:t>${['A','B','C','D'][oIdx]}) ${opt}</w:t></w:r></w:p>
                                `;
                            });
                        }
                    });

                    const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                    <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
                        <w:body>
                            ${bodyContent}
                            <w:sectPr>
                                <w:pgSz w:w="11906" w:h="16838"/>
                                <w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/>
                            </w:sectPr>
                        </w:body>
                    </w:document>`;

                    const zip = new JSZip();
                    zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
                    zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
                    zip.file("word/document.xml", documentXml);

                    const content = await zip.generateAsync({ type: "blob" });
                    const url = URL.createObjectURL(content);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `English_Exam_${inf.grade.replace(/\s+/g, '_')}.docx`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    alert('تم تصدير ملف Word بنجاح وتنزيله إلى جهازك.');
                } catch (e) {
                    console.error(e);
                    alert('حدث خطأ أثناء تصدير الملف.');
                }
            }
        }

        const app = new ExamApp();
    </script>
</body>
</html>
